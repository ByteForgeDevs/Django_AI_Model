[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "djaudit"
version = "0.1.0"
description = "Django-aware static analysis: security, DRF authorization, ORM performance, migration safety and database portability."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ByteForgeDevs" }]
keywords = ["django", "static-analysis", "security", "sarif", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
djaudit = "djaudit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    # Not a runtime dependency: djaudit never imports the target's Django.
    # Installed so tests can check our defaults table against the real
    # django.conf.global_settings instead of trusting a transcription.
    "django>=5.2",
    # Same reason, and the floor matters: our DRF defaults table is checked
    # against rest_framework.settings.DEFAULTS by tests/test_drf_defaults.py,
    # so the installed release decides which version those values are true of.
    # 3.17 is what the support matrix in docs/PROJECT_PLAN.md claims.
    "djangorestframework>=3.17",
    # Two connections at once, which `psql` cannot give us. The lock
    # classification's real claim is not which mode PostgreSQL takes but what
    # that mode blocks, and the only honest way to check "blocks writes" is to
    # hold the lock on one connection and attempt a write on another. Doing
    # that with subprocesses means sleeping and guessing, which is how a
    # concurrency test becomes flaky by construction.
    "psycopg[binary]>=3.2",
    # The external tools of Step 5.3. Dev-only: djaudit never imports them and
    # a missing one is an ordinary fact about a machine rather than an error,
    # which `Availability` exists to express. They are pinned in here so the
    # measurements the adapter layer is built on stay reproducible -- a claim
    # about a tool's output that CI cannot re-run is a claim nobody is
    # checking. bandit is here despite 5.3.3 declining to adapt it, and that is
    # the point: the decline rests on bandit's own check inventory, which
    # `scripts/check_bandit_subsumed.py` re-reads on every commit so that a
    # Django-relevant check added in a later release reopens the decision
    # instead of passing unnoticed.
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/djaudit"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Fixtures are deliberately broken Django code -- linting them defeats the point.
# Docs contain illustrative snippets whose alignment carries meaning, and ruff
# formats fenced Python blocks inside markdown.
extend-exclude = ["tests/fixtures", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PTH", "C4", "TID", "PL"]
ignore = ["ANN401", "PLR0911", "PLR0912", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "PLC0415"]
# Builder-style APIs: many keyword arguments is the interface, not a smell.
"src/djaudit/cli.py" = ["PLR0913", "PLR0917"]
"src/djaudit/engine.py" = ["PLR0913", "PLR0917"]
"src/djaudit/registry.py" = ["PLR0913", "PLR0917"]
"src/djaudit/rules/_base.py" = ["PLR0913", "PLR0917"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
exclude = "tests/fixtures"
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# jsonschema is deliberately not a project dependency. The SARIF conformance
# check runs it via `uv run --with`, so it stays out of what users install.
[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

# Django is a dev-only dependency, used so tests can cross-check our defaults
# table against the real global_settings. It ships no stubs, and pulling in
# django-stubs purely for that would be disproportionate.
[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

# Likewise DRF, imported only so tests can check ALL_FIELDS and the serializer
# base names against the real package rather than a transcription of them.
[[tool.mypy.overrides]]
module = "rest_framework.*"
ignore_missing_imports = true

# bandit ships no py.typed. It is imported in exactly one place -- the gate
# that re-checks 5.3.3's decline by reading bandit's own check inventory --
# and that gate reads two attributes off a registry, so stubs would document
# nothing the script does not already assert about the shape it gets back.
[[tool.mypy.overrides]]
module = "bandit.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
norecursedirs = ["tests/fixtures"]
