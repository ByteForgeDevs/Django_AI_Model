name: CI

on:
  push:
    # Phase branches too, so every substep gets a gate result rather than the
    # whole phase discovering breakage at pull request time.
    branches: [main, 'phase-*']
  pull_request:
  # Called by `release.yml` so a tag runs this whole file rather than trusting
  # that some earlier commit passed it. A tag can be moved; a run on the tagged
  # tree cannot be.
  workflow_call:

env:
  UV_VERSION: "0.12.1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      # The changelog is generated from the whole commit trail, so the default
      # depth-1 checkout would rebuild it from a single commit and report it
      # stale on every pull request.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          # Pinned, not floating. Resolving "latest" costs an anonymous GitHub
          # API call from a shared runner IP, which has already rate-limited
          # and failed a green commit; and an unpinned toolchain means CI can
          # break on a morning when nobody changed anything.
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: uv sync

      - name: ruff
        run: uv run ruff check .

      # Checked separately from `ruff check`, which does not police formatting.
      # Without this the tree drifts out of format silently and the first person
      # to run `ruff format` sweeps unrelated files into their diff.
      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      # The plan states its own counts and its own progress. The counts were
      # wrong the first time they were written by hand; the progress was wrong
      # for the whole of Phase 2, because this step used to compare the plan
      # only with itself and passed on a phase marked "Not started" whose
      # eighteen rules were registered and running. It reads the registry now.
      - name: project plan matches the registry
        run: uv run python scripts/check_plan.py

      # A verdict is worth the reasoning behind it, and nothing in the tool can
      # tell a considered `accepted_risk` from a rubber stamp. A rubber stamp
      # on a precision benchmark is how a project ends up with a 100% score and
      # no credibility, so the standard is enforced on our own files.
      - name: benchmark verdicts are a completed review
        run: uv run python scripts/check_triage.py

      # A triage layer is only as meaningful as the corpus it is scored on. If
      # a baseline that reads nothing scores well on both directions at once,
      # or the set of findings the reviewer was ever in two minds about shrinks
      # to nothing, then triage on this corpus has become trivial and any
      # figure measured against it is decoration. Printed on every commit, so
      # the floor a model must clear is a number rather than a claim.
      - name: triage baselines still discriminate
        run: uv run python scripts/triage_baselines.py

      # The shipped prior lets djaudit skip asking about five rules on the
      # authority of verdicts recorded here. Retriaging a finding must not
      # leave that table behind: a stale entry keeps suppressing a question
      # using evidence that has since changed its mind.
      - name: triage prior matches the recorded verdicts
        run: uv run python scripts/gen_triage_prior.py --check

      # The rule reference is generated from the registry, so an edit to a
      # rule's grade or wording that never reaches the page turns published
      # security documentation into a description of a tool we no longer ship.
      - name: rule reference matches the registry
        run: uv run python scripts/gen_rule_docs.py --check

      # A failure-modes note is the one kind of documentation where being stale
      # is worse than being absent: absent, a reader goes and looks; stale,
      # they believe it. Every checkable claim in the LLM architecture note --
      # cited paths, measured figures, the size of the corpus prior, which
      # rules `fix` will write -- is compared against the code.
      - name: llm architecture note matches the code
        run: uv run python scripts/check_llm_doc.py

      # The same argument, with more at stake: the live tier executes the
      # audited project's code on the auditing machine, and this note is the
      # security model for that. A reader deciding whether `--live` is safe on
      # a repository they have not vetted is relying on the passthrough list
      # and the refusal list being the ones the runner actually applies.
      - name: live tier note matches the code
        run: uv run python scripts/check_live_doc.py

      # Step 5.3.3 planned a bandit adapter and measurement declined it: ruff's
      # `S` rules are a port of bandit, and on the corpus bandit's only
      # unshared output was noise or a duplicate. A decline stops being
      # re-examined the moment it is written down, so the structural half --
      # every bandit check has a ruff counterpart or a recorded reason -- is
      # re-checked here. bandit gains checks between releases, and a
      # Django-relevant one should reopen the decision rather than pass
      # unnoticed.
      - name: bandit is still subsumed by ruff
        run: uv run python scripts/check_bandit_subsumed.py

      # The decision record for what we take from other people's tools. Its
      # claims rot quietly -- a count of claims in a table, which verdict a
      # code carries, which adapter reaches the network -- because none of
      # them break a test when they change. The one about the network is the
      # reason this runs in the fast job rather than the corpus one: a reader
      # deciding whether `--external` is safe offline is relying on that
      # column being the one `REACHES_THE_NETWORK` actually holds.
      - name: adapters note matches the code
        run: uv run python scripts/check_adapters_doc.py

      # Publishing is the one action here with no undo: a version on PyPI is
      # permanent and its files immutable, and `__version__` is stamped into
      # every report that release will ever emit. This checks the release path
      # on every commit rather than on the tag, because the tag is the moment
      # it is too late to find out that the workflow can be started by hand,
      # that publishing no longer waits for this file, or that somebody added
      # an API token to a repository whose publishing needs none.
      - name: releases can only happen the way we say
        run: uv run python scripts/check_release.py

      # The published contract: report shape, enum vocabularies, and the
      # fingerprint digests every downstream baseline is keyed on. The last is
      # why this runs on every commit rather than at release time -- changing
      # how a snippet is normalised alters no field name, breaks no test that
      # checks fingerprints are stable, and silently invalidates every baseline
      # committed in every repository that has adopted the tool.
      - name: the published contract has not moved
        run: uv run python scripts/gen_schema.py --check

      # The changelog is a derived file, so the only way it can be wrong is if
      # someone edited it by hand or forgot to regenerate it. Both read the
      # same here: rebuild from the trail and compare.
      - name: the changelog matches the commit trail
        run: uv run python scripts/gen_changelog.py --check

      # The composite action is a string executed on someone else's runner, so
      # a renamed CLI flag or a mistyped input surfaces as a failure in their
      # repository rather than ours. This checks it against the real CLI.
      - name: the action still matches the CLI it wraps
        run: uv run python scripts/check_action.py

      # Same reasoning as the action: the hook manifest is executed inside
      # someone else's repository by a tool that builds its own environment.
      - name: the pre-commit hooks still match the CLI they invoke
        run: uv run python scripts/check_pre_commit.py

      # DJP-002 tells people to add `prefetch_related`, and that is only sound
      # for the three manager methods that read back out of the prefetch
      # cache. Every other method clones the queryset and re-queries, so the
      # advice would cost a query rather than save one. Our tests encode that
      # split but cannot observe it; this runs real Django and counts.
      - name: prefetch cache behaviour still matches CACHE_READS
        run: uv run python scripts/prefetch_cache_probe.py

      - name: pytest
        run: uv run pytest

      # SARIF is the entire CI integration story. If the structure drifts,
      # GitHub silently stops ingesting findings and no other gate notices.
      - name: SARIF conforms to the OASIS 2.1.0 schema
        run: |
          uv run djaudit run tests/fixtures/vulnerable_project \
            --format sarif --output /tmp/report.sarif \
            --min-severity info --min-confidence tentative || [ $? -eq 1 ]
          curl -sfL --retry 3 --max-time 60 \
            "https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json" \
            -o /tmp/sarif-schema.json
          uv run --with jsonschema python scripts/validate_sarif.py \
            /tmp/report.sarif /tmp/sarif-schema.json

  evaluation:
    name: recall gate (planted-defect fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # Pinned, not floating. Resolving "latest" costs an anonymous GitHub
          # API call from a shared runner IP, which has already rate-limited
          # and failed a green commit; and an unpinned toolchain means CI can
          # break on a morning when nobody changed anything.
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: uv sync

      # Rules interact. Without a scored gate, a new rule silently breaks an
      # existing one's grading and nobody notices until a user does.
      - name: score against fixture manifests
        run: |
          uv run djaudit eval tests/fixtures/vulnerable_project \
            --summary "$GITHUB_STEP_SUMMARY"
          uv run djaudit eval tests/fixtures/overridden_project \
            --summary "$GITHUB_STEP_SUMMARY"
          uv run djaudit eval tests/fixtures/api_project \
            --summary "$GITHUB_STEP_SUMMARY"
          uv run djaudit eval tests/fixtures/env_settings_project \
            --summary "$GITHUB_STEP_SUMMARY"
          uv run djaudit eval tests/fixtures/near_miss_project \
            --summary "$GITHUB_STEP_SUMMARY"
          uv run djaudit eval tests/fixtures/drf_project \
            --summary "$GITHUB_STEP_SUMMARY"
          uv run djaudit eval tests/fixtures/orm_project \
            --summary "$GITHUB_STEP_SUMMARY"
          uv run djaudit eval tests/fixtures/injection_project \
            --summary "$GITHUB_STEP_SUMMARY"
          uv run djaudit eval tests/fixtures/migration_project \
            --summary "$GITHUB_STEP_SUMMARY"
          uv run djaudit eval tests/fixtures/portability_project \
            --summary "$GITHUB_STEP_SUMMARY"

      # The manifest above proves the controls are silent. It cannot prove they
      # are reachable, and a control the rule never looks at is silent for the
      # wrong reason -- which is how a fixture comes to certify a broken rule.
      - name: prove the recall fixtures' controls are load-bearing
        run: uv run python scripts/fixture_controls_probe.py

  live:
    name: live tier (real PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          # Deliberately contains an `@` and a space, both percent-encoded in
          # the DSN below. `urlparse` does not percent-decode and libpq does,
          # so a fixture that passes the raw value to Django authenticates
          # `psql` fine and fails every live test with what looks like a
          # server that is down. A plain password would never exercise it.
          POSTGRES_PASSWORD: "p@ss word"
          POSTGRES_USER: djaudit
          POSTGRES_DB: app
        ports:
          - 5432:5432
        # Without this the job races the container: the first connection
        # arrives before initdb has finished and the failure looks like ours.
        options: >-
          --health-cmd "pg_isready -U djaudit -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJAUDIT_TEST_POSTGRES: "postgresql://djaudit:p%40ss%20word@127.0.0.1:5432/app"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: uv sync

      # The suite drives `psql` directly to create and drop a database per
      # test. The runner image ships a client, but its version is not ours to
      # pin, so this fails loudly here rather than inside a fixture.
      - name: psql is available
        run: psql --version

      # Proves the container is reachable *as configured* before any test
      # runs. A wrong password here is a one-line error; discovered thirty
      # tests later it is thirty confusing ones.
      - name: the service container answers on the DSN we will use
        run: psql "$DJAUDIT_TEST_POSTGRES" -tAc "SELECT version()"

      # Machine-readable rather than grepped: the summary line is prose and
      # has changed shape between pytest releases.
      - name: live tier tests
        run: uv run pytest tests/live --junitxml=/tmp/live.xml

      # The whole job is decoration without this. Every test in `tests/live`
      # skips itself when `DJAUDIT_TEST_POSTGRES` is unset, so a typo in the
      # env block above turns this job green while running nothing at all --
      # and "0 failed" reads identically either way.
      - name: no live test was skipped
        if: always()
        run: uv run python scripts/live_gate.py /tmp/live.xml

  false_positives:
    name: precision gate (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # `budget` is seconds one analysis run may take on this target. It
          # was one shared number until Step 3.2 added whole-project dataflow,
          # which spread the three targets from 1.0s to 7.3s here -- driven by
          # how many loops a project writes, not how many files it has. A
          # single ceiling then measures only the slowest target and lets the
          # other two drift by 7x unnoticed, which is the failure the shared
          # number was meant to prevent.
          #
          # Measured on this runner: healthchecks 0.98s, netbox 7.05s, pretix
          # 7.25s. Each budget is roughly 2.7x its measurement, which is not
          # generosity: the same runs take 2.27s, 13.15s and 13.36s on a loaded
          # development machine, and a gate contributors cannot pass locally is
          # a gate that gets switched off.
          - name: healthchecks
            repo: healthchecks/healthchecks
            sha: 5086d282ea33831e8c86eb9d0802dc2602c66ef7
            budget: 3.5
          - name: netbox
            repo: netbox-community/netbox
            sha: 4877d1167f4e20c0507bc902ee4c708e20f92e36
            budget: 20
          # DRF-heavy and multi-tenant, which neither of the other two are:
          # healthchecks has no DRF at all and NetBox scopes nothing to a
          # tenant, so without this the Phase 2 authorization rules would have
          # had a single project measuring their precision.
          - name: pretix
            repo: pretix/pretix
            sha: 7627e4b54825318c87f2093bfa078b4d039fb85a
            budget: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # Pinned, not floating. Resolving "latest" costs an anonymous GitHub
          # API call from a shared runner IP, which has already rate-limited
          # and failed a green commit; and an unpinned toolchain means CI can
          # break on a morning when nobody changed anything.
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: uv sync

      # Pinned by SHA and never vendored: keeps our repository licence-clean and
      # the benchmark reproducible.
      - name: clone target
        run: |
          git clone --quiet https://github.com/${{ matrix.target.repo }}.git target
          git -C target checkout --quiet ${{ matrix.target.sha }}

      # These repositories are mature and well audited, so they measure
      # precision and crash-resistance, not recall -- we cannot know what they
      # contain that we missed. Recall is what the planted-defect fixtures
      # measure. Every finding carries a recorded verdict in benchmarks/, so
      # the gate tracks a false-positive rate instead of asserting zero.
      - name: precision gate
        run: |
          # Exit 1 means "findings exist", which is the normal case here and
          # not the gate's verdict -- `djaudit benchmark` decides that against
          # the recorded verdicts. Exit 2 means the tool broke, which is a real
          # failure, so the two are handled separately rather than with `|| true`.
          uv run djaudit run target \
            --format json \
            --output report.json \
            --min-severity info \
            --min-confidence tentative || [ $? -eq 1 ]
          uv run djaudit benchmark target \
            --triage benchmarks/${{ matrix.target.name }}.json \
            --summary "$GITHUB_STEP_SUMMARY"

      # A different question from precision, against a different oracle. The
      # findings gate asks whether what we said is true; this asks whether we
      # read the project at all. Its answer comes from the target's own
      # migrations -- written by Django at runtime with every package
      # installed -- so it is independent of anything djaudit believes.
      - name: model graph coverage
        run: |
          uv run python scripts/graph_coverage.py target \
            --name ${{ matrix.target.name }} \
            --expect benchmarks/graph/${{ matrix.target.name }}.json

      # A third question, and the only gate here that can see a finding that
      # was never made. Marking a linter's rule code SUBSUMED deletes every
      # finding it would have produced, on the assertion that one of our rules
      # covers the same ground; the precision gate cannot check that, because a
      # finding that does not exist cannot be a false positive. This runs ruff
      # restricted to the subsumed codes and compares where it reports against
      # where our rule does. The recorded shortfall is not expected to be zero
      # -- our rules are deliberately narrower than the linters they subsume --
      # but it is expected not to grow without somebody looking.
      - name: subsumption claims still hold
        run: |
          uv run python scripts/check_subsumption.py target \
            --name ${{ matrix.target.name }} \
            --expect benchmarks/subsumption/${{ matrix.target.name }}.json

      # Risk 8 described this step as existing for the whole of Phase 2 while
      # nothing here timed anything. It is checked on the same clone the
      # precision gate just used.
      #
      # Performance is the one property that decays without anyone making a
      # mistake: each new rule walks the same trees, so the cost grows a little
      # at a time and no single commit looks like the one that broke it.
      - name: timing gate
        run: |
          uv run python scripts/timing_gate.py target \
            --name ${{ matrix.target.name }} \
            --budget ${{ matrix.target.budget }} \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.target.name }}
          path: report.json

  action:
    name: composite action (on a runner)
    runs-on: ubuntu-latest
    # The clean-tree audit below uploads a SARIF report with zero results. It
    # creates no alerts, and it is the only way to learn that code scanning
    # accepts the shape of what we emit.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # `install: false` throughout: the action's default installs a pinned
      # release from PyPI, and testing that here would test the last release
      # rather than this commit.
      - name: install this commit
        run: pip install .

      - name: audit a fixture that has findings
        id: dirty
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/vulnerable_project
          install: "false"
          upload-sarif: "false"
          sarif-file: dirty.sarif
          min-severity: info
          min-confidence: tentative

      # The action must fail on findings, and must have written the report
      # before doing so -- that ordering is the whole design, and it is not
      # observable anywhere but here.
      - name: findings failed the action, after the report was written
        run: |
          test "${{ steps.dirty.outcome }}" = "failure" \
            || { echo "::error::the action passed on a project full of findings"; exit 1; }
          test -f dirty.sarif \
            || { echo "::error::the action failed without writing a report"; exit 1; }
          python -c "import json,sys; r=json.load(open('dirty.sarif'))['runs'][0]['results']; \
            sys.exit(0 if r else 'the report is empty')"
          test "${{ steps.dirty.outputs.exit-code }}" = "1"

      # near_miss_project exists to prove we do not flag things that merely
      # look wrong, so it is genuinely clean at the default thresholds.
      - name: audit a clean tree, and upload it for real
        id: clean
        uses: ./
        with:
          path: tests/fixtures/near_miss_project
          install: "false"
          sarif-file: clean.sarif

      - name: a clean tree passes
        run: test "${{ steps.clean.outputs.exit-code }}" = "0"

  pre_commit:
    name: pre-commit hooks (with the real tool)
    runs-on: ubuntu-latest
    steps:
      # pre-commit clones this repository at a revision, so the checkout needs
      # the history the consumer config points at.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install pre-commit
        run: pip install pre-commit

      # These tests are opt-in, and an opt-in that silently does nothing is
      # exactly what it exists to prevent -- so the run is required to report
      # no skips.
      - name: the hooks install and run under pre-commit
        env:
          DJAUDIT_TEST_PRE_COMMIT: "1"
        run: |
          # `-q` is in addopts, so it wins over -v and no "SKIPPED" line is ever
          # printed. The summary line is the signal that survives it.
          uv run pytest tests/test_pre_commit.py --no-header | tee /tmp/hooks.txt
          if grep -qE '[0-9]+ skipped' /tmp/hooks.txt; then
            echo "::error::a pre-commit test skipped, so the hooks were not actually exercised"
            exit 1
          fi
